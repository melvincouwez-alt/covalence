# iCloud Drive in Files' sidebar, exported by covalenced (see covalenced/cloudprovider.py).
# libcloudproviders reads the "Cloud Providers" group: a file without it crashes its
# collector (0.4.0 reads error->message on a NULL error), so keep this group name.
[Cloud Providers]
BusName=io.github.melvincouwez.Covalence.Daemon
ObjectPath=/io/github/melvincouwez/Covalence/CloudProviders
